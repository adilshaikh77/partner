<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Ten Years — Letters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Literata:ital,wght@0,400;0,600;1,400;1,500&family=Noto+Serif+Devanagari:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --red: #e0543d;
        --red-dim: #a83a29;
        --black-fur: #423d5c;
        --outline: #100f1a;
        --gold: #f2c14e;
        --gold-dim: #b6913a;
        --cream: #f3ede0;
        --dim: #cabfe0;
        --px: 8px;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: 'Literata', Georgia, serif;
      }

      /* ================= SCENE ================= */
      #scene {
        position: fixed;
        inset: 0;
        background: linear-gradient(
          to bottom,
          #2a1f47 0%,
          #402a52 22%,
          #5a3a54 40%,
          #7a4a4f 55%,
          #1c1330 78%,
          #0a0b1a 100%
        );
        overflow: hidden;
      }
      .star {
        position: absolute;
        border-radius: 50%;
        background: var(--cream);
        animation: twinkle 3.5s ease-in-out infinite;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 1;
        }
      }

      .shooting {
        position: absolute;
        width: 2px;
        height: 2px;
        background: var(--gold);
        box-shadow: 0 0 8px 2px var(--gold);
        border-radius: 50%;
        animation: shoot 4s linear infinite;
        opacity: 0;
      }
      .shooting::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 56px;
        height: 2px;
        background: linear-gradient(
          to right,
          rgba(242, 193, 78, 0.85),
          transparent
        );
        transform-origin: 0% 50%;
        transform: rotate(-30deg);
      }
      @keyframes shoot {
        0% {
          opacity: 0;
          transform: translate(0, 0) rotate(0deg);
        }
        4% {
          opacity: 1;
        }
        28% {
          opacity: 0;
          transform: translate(-260px, 150px) rotate(0deg);
        }
        100% {
          opacity: 0;
        }
      }

      .moon {
        position: absolute;
        top: 8%;
        right: 12%;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background-image: url('images/blue-moon.png');
        background-size: cover;
        background-position: center;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 0 40px 10px rgba(242, 193, 78, 0.35);
      }

      .mtn {
        position: absolute;
        bottom: 14%;
        left: 0;
        width: 100%;
      }
      .mtn-back {
        fill: #241c3d;
      }
      .mtn-front {
        fill: #160f27;
      }

      .ground {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 16%;
        background: repeating-linear-gradient(
          90deg,
          #2c4636 0 6px,
          #2c4636 6px 12px
        );
        border-top: 3px solid #1c2f24;
      }

      .firefly {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 6px 2px rgba(242, 193, 78, 0.8);
        animation: fly 7s ease-in-out infinite;
        opacity: 0.8;
      }
      @keyframes fly {
        0% {
          transform: translate(0, 0);
          opacity: 0.2;
        }
        25% {
          transform: translate(10px, -18px);
          opacity: 1;
        }
        50% {
          transform: translate(-8px, -30px);
          opacity: 0.4;
        }
        75% {
          transform: translate(6px, -14px);
          opacity: 1;
        }
        100% {
          transform: translate(0, 0);
          opacity: 0.2;
        }
      }

      /* decorative couple image, bottom center */
      .couple-img {
        position: absolute;
        bottom: 13%;
        left: 50%;
        transform: translateX(-50%);
        width: 150px;
        height: auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.45));
        z-index: 3;
      }

      /* ================= ENVELOPES ================= */
      .env-slot {
        position: absolute;
        width: 54px;
        height: 40px;
        cursor: pointer;
        transition:
          transform 0.48s cubic-bezier(0.4, 0.65, 0.2, 1),
          opacity 0.48s ease;
        z-index: 5;
        background: transparent;
        border: none;
        padding: 0;
        margin: 0;
        -webkit-appearance: none;
        appearance: none;
      }
      .env-slot.flying {
        transform: translate(var(--fx), var(--fy)) scale(2.8)
          rotate(12deg);
        opacity: 0;
        pointer-events: none;
      }
      .env-slot.opened {
        opacity: 0.9;
      }

      .env-float {
        width: 100%;
        height: 100%;
        position: relative;
      }

      .env-body {
        position: absolute;
        inset: 0;
        background: var(--gold);
        border: 2px solid var(--outline);
        border-radius: 2px;
      }
      .env-flap {
        position: absolute;
        top: -1px;
        left: -1px;
        right: -1px;
        height: 23px;
        background: var(--gold-dim);
        clip-path: polygon(0 0, 100% 0, 50% 92%);
        border-bottom: 2px solid var(--outline);
      }
      .env-seal {
        position: absolute;
        left: 50%;
        top: 56%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        line-height: 1;
        color: var(--red);
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
      }
      .env-slot:hover .env-body {
        background: #ffd97a;
      }
      .env-slot:focus-visible .env-body {
        outline: 2px solid var(--cream);
        outline-offset: 2px;
      }

      /* ================= LETTER OVERLAY ================= */
      #letterOverlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(8, 7, 18, 0.72);
        backdrop-filter: blur(2px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      #letterOverlay.show {
        display: flex;
      }

      .letter-card {
        background: var(--cream);
        color: #2c2438;
        width: 100%;
        max-width: 430px;
        max-height: 78vh;
        border-radius: 6px;
        padding: 26px 24px 20px;
        position: relative;
        transform: rotate(-1deg);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        display: flex;
        flex-direction: column;
        animation: cardIn 0.42s cubic-bezier(0.25, 0.9, 0.3, 1.1);
      }
      .letter-card.exit {
        animation: cardOut 0.32s ease forwards;
      }
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: scale(0.55) rotate(-1deg) translateY(20px);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(-1deg) translateY(0);
        }
      }
      @keyframes cardOut {
        from {
          opacity: 1;
          transform: scale(1) rotate(-1deg) translateY(0);
        }
        to {
          opacity: 0;
          transform: scale(0.55) rotate(-1deg) translateY(20px);
        }
      }

      .letter-seal {
        position: absolute;
        top: -14px;
        left: 24px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--red);
        border: 2px solid var(--outline);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--gold);
        font-size: 15px;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.4);
      }
      .letter-title {
        font-family: 'Press Start 2P', monospace;
        font-size: 15px;
        color: var(--red-dim);
        margin: 12px 0 16px;
        letter-spacing: 0.5px;
      }
      .letter-body {
        overflow-y: auto;
        line-height: 1.8;
        font-size: 16.5px;
        white-space: pre-line;
        padding-right: 8px;
        flex: 1;
        font-family:
          'Literata', 'Noto Serif Devanagari', Georgia, serif;
      }
      .letter-body::-webkit-scrollbar {
        width: 6px;
      }
      .letter-body::-webkit-scrollbar-thumb {
        background: #d9cdae;
        border-radius: 3px;
      }

      .letter-close {
        position: absolute;
        top: -14px;
        right: -10px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid var(--outline);
        background: var(--red);
        color: var(--cream);
        font-family: 'Press Start 2P', monospace;
        font-size: 12px;
        cursor: pointer;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.4);
      }
      .letter-close:hover,
      .letter-close:focus-visible {
        background: #ff6a4f;
        outline: 2px solid var(--cream);
        outline-offset: 1px;
      }

      /* ================= HEADER ================= */
      #hint {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Press Start 2P', monospace;
        font-size: 9px;
        color: var(--dim);
        text-align: center;
        z-index: 4;
        letter-spacing: 0.5px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }

      @media (max-width: 480px) {
        .env-slot {
          width: 46px;
          height: 34px;
        }
        .letter-body {
          font-size: 15px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .star,
        .firefly {
          animation: none !important;
        }
        .env-slot,
        .letter-card {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div class="moon"></div>
      <div id="starLayer"></div>

      <svg
        class="mtn"
        viewBox="0 0 400 100"
        preserveAspectRatio="none"
        style="height: 120px"
      >
        <polygon
          class="mtn-back"
          points="0,100 0,55 60,20 130,60 200,15 260,55 320,25 400,60 400,100"
        />
      </svg>
      <svg
        class="mtn"
        viewBox="0 0 400 100"
        preserveAspectRatio="none"
        style="height: 80px; bottom: 10%"
      >
        <polygon
          class="mtn-front"
          points="0,100 0,65 90,30 170,68 250,35 340,65 400,45 400,100"
        />
      </svg>

      <div id="fireflyLayer"></div>
      <div class="ground"></div>

      <img
        class="couple-img"
        src="images/cat-couple.png"
        alt="the two of us"
      />

      <div id="envLayer"></div>
    </div>

    <div id="hint">▸ TAP AN ENVELOPE</div>

    <div id="letterOverlay">
      <div class="letter-card" id="letterCard">
        <div class="letter-seal">♥</div>
        <button
          class="letter-close"
          id="closeBtn"
          aria-label="Close letter"
        >
          ✕
        </button>
        <div class="letter-title" id="letterTitle"></div>
        <div class="letter-body" id="letterBody"></div>
      </div>
    </div>

    <script>
      /* =========================================================
   STARS + FIREFLIES
========================================================= */
      const starLayer = document.getElementById('starLayer');
      for (let i = 0; i < 50; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 2 + 1;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 55 + '%';
        s.style.animationDelay = Math.random() * 3.5 + 's';
        starLayer.appendChild(s);
      }
      const fireflyLayer = document.getElementById('fireflyLayer');
      for (let i = 0; i < 10; i++) {
        const f = document.createElement('div');
        f.className = 'firefly';
        f.style.left = 10 + Math.random() * 80 + '%';
        f.style.top = 55 + Math.random() * 35 + '%';
        f.style.animationDelay = Math.random() * 6 + 's';
        f.style.animationDuration = 5 + Math.random() * 4 + 's';
        fireflyLayer.appendChild(f);
      }

      for (let i = 0; i < 3; i++) {
        const sh = document.createElement('div');
        sh.className = 'shooting';
        sh.style.left = 45 + Math.random() * 45 + '%';
        sh.style.top = Math.random() * 35 + '%';
        sh.style.animationDelay = i * 5 + Math.random() * 4 + 's';
        starLayer.appendChild(sh);
      }

      /* =========================================================
   LETTERS — edit freely. Each id must be unique 1-10.
   Titles show in the pixel-font header; body supports
   blank lines for paragraph breaks.
========================================================= */
      const LETTERS = [
        {
          id: 1,
          title: '💕',
          body: `Naznin das saal ho gye tere saath, aise socho to kitna sab time lagta hai, par ye 10 saal mere liye ek pal ki tarah guzar gaye. Tere saath bitaye har pal ke liye shukriya.
          Pata mujhe ye ghamand k mujhe jo chahiye me leke rehta, bas teri wajah se, kyuki jab se tujhe dekha tha haste hue, mene socha tha k mujhe ye chahiye. Aise to koi aur chiz k liye zid ni kiye uppar wale se, bas tujhe chhod k.
— Tera Shohar`,
        },

        {
          id: 2,
          title: '💖',
          body: `Mujhe hota me sab chize laake tere saamne rakhdu. Achhe achhe pyaare dress, mst mst lipstick, jo bhi chhoti chiz dikhe, sab sab tere saamne rakh du. Tujhe khush kru, tere chehre ki hasi dekhu.

— Tera Adil`,
        },

        {
          id: 3,
          title: '💗',
          body: `Tujhse dur rehna achha nai lagta, akela akela lagta hamesha jb bhi tera msg call nai aata to, par fir jab tu msg call krti to aisa hota bas phn me se ghus k tujhe gale lagane aajau. Kitni der apan dur rahe. Paas to tu hamesha rahi mere. Nai ab zyada time apan dur reh rahe mere se nai hota. Tujhe fir mere saamne bitha k rakhu aur dekhta rahu

— Tera baby`,
        },

        {
          id: 4,
          title: '💓',
          body: `Tu mujhse kitna sab pyar krti, meri sunnti rehti daat deta to, mera gussa seh leti, mujhe samjhaati, mujhe khush krti, mujhe himmat deti, meri itni izzat krti, meri kitni sab fikr krti, ye sab itna dur reh k, fir jb tu paas rahegi to kitna sab pyar kregi me to khushi se mar jaauga.

— Tera darling`,
        },

        {
          id: 5,
          title: '🫂',
          body: `Tu bohot khubsurat hai, teri aankhe door koi taare ki tarah chamakti. Tere hoth gulab ki tarah laal, teri hasi phool ki tarah khilti, teri baatein dil ko sukoon deti, tere baal khule krke haath ghumaane mann krta, tera chehra chaand ki tarah chamakta, chaand bhi tere aage fika pad jaaye. Tujhpe har kapde aake pyare bann jaate. 

— Teri jaan`,
        },

        {
          id: 6,
          title: '💘',
          body: `Bohot pyar krta tujhse naznin. Kitna? Tu hissa hai mera, Aisi koi waqt nai jo tujhe soche bina jaaye, na mujhe aisa waqt chahiye. Mere dil me tu, mere dimaag me tu, mere sapno me tu, meri dhadkan me tu, aankhe bandh kru to tu dikhti, aankhe kholu to tu dikhti. Pagal hu tere liye tere pyar me. Har din pyar badhta tere liye, din khatam hota to lagta kam pyar kiya aur krna. Itne sab saal hogye mera mann nai bhara, aur bohot pyar bhara pada tere liye, zindagi bhar rahega.
— Tera shonaa`,
        },

        {
          id: 7,
          title: '🖤',
          body: `Tu meri hai naznin, aur me tera. Tujhe jitna lagta me tujhse pyar krta me uss se bohot zyada pyar krta. Tu jitna sochti me teri izzat krta me uss se bohot zyada teri izzat krta. Tu biwi hai meri naznin, bohot fikr krta teri. Allah tujhe saari khushiya de, tu jo jo sochi tere khud k liye, apan k liye, ghar walo k liye, sab allah pura kre, aur ho sake to mere zariye. Tere chehre pe aayi hasi meri wajah se aaye hamesha. Aansu aaye to vo bhi sirf khushi k ho. Hamesha tere paas rahuga, tujhe duniya ki saari khushiya du.

— Naznin ka Adil`,
        },

        {
          id: 8,
          title: 'To Us, Getting Married',
          body: `My love,

Soon, we get married. After the window, the bike, the ocean between us, the years of patience — we finally just get to stay.

I keep trying to imagine what it'll feel like to not say goodbye at an airport again. I can't quite picture it yet. I can't wait to find out.

— A.`,
        },

        {
          id: 9,
          title: 'To Our Someday Kids',
          body: `My love,

I still tell you I want three — two daughters and a son. You laugh every time, but I mean it.

I think about the version of us that gets to be parents together, and it makes everything we've gone through feel worth it twice over.

— A.`,
        },

        {
          id: 10,
          title: 'Ten Years, and Always',
          body: `My love,

You are the most precious thing in my life, and I don't say that lightly.

You've trusted me and been patient with me, and chosen me again and again, in moments when it would have been easier not to.

I don't picture my life without you in it. I don't plan to find out what that looks like.

Happy ten years. Here's to every year after this one.

— A.`,
        },
      ];

      /* Positions as [left%, top%] — a clean 2-column x 5-row grid, filled
   left-to-right then top-to-bottom, so letter 1&2 are row one, 3&4 row two, etc. */
      const POSITIONS = [
        [28, 15],
        [64, 15],
        [28, 27],
        [64, 27],
        [28, 39],
        [64, 39],
        [28, 51],
        [64, 51],
        [28, 63],
        [64, 63],
      ];

      /* =========================================================
   BUILD ENVELOPES
========================================================= */
      const envLayer = document.getElementById('envLayer');
      LETTERS.forEach((letter, i) => {
        const [l, t] = POSITIONS[i];
        const slot = document.createElement('button');
        slot.className = 'env-slot';
        slot.style.left = l + '%';
        slot.style.top = t + '%';
        slot.setAttribute(
          'aria-label',
          'Open letter: ' + letter.title,
        );
        slot.innerHTML = `
    <div class="env-float">
      <div class="env-body"></div>
      <div class="env-flap"></div>
      <div class="env-seal">♥</div>
    </div>
  `;
        slot.addEventListener('click', () =>
          openLetter(letter, slot),
        );
        envLayer.appendChild(slot);
      });

      /* =========================================================
   OPEN / CLOSE LOGIC
========================================================= */
      const overlay = document.getElementById('letterOverlay');
      const card = document.getElementById('letterCard');
      const titleEl = document.getElementById('letterTitle');
      const bodyEl = document.getElementById('letterBody');
      const closeBtn = document.getElementById('closeBtn');
      let activeSlot = null;

      function openLetter(letter, slotEl) {
        activeSlot = slotEl;
        const rect = slotEl.getBoundingClientRect();
        const cx = window.innerWidth / 2,
          cy = window.innerHeight / 2;
        const dx = cx - (rect.left + rect.width / 2);
        const dy = cy - (rect.top + rect.height / 2);
        slotEl.style.setProperty('--fx', dx + 'px');
        slotEl.style.setProperty('--fy', dy + 'px');
        slotEl.classList.add('flying');
        slotEl.classList.add('opened');

        titleEl.textContent = letter.title;
        bodyEl.textContent = letter.body;
        bodyEl.scrollTop = 0;

        setTimeout(() => {
          overlay.classList.add('show');
          card.classList.remove('exit');
        }, 300);
      }

      function closeLetter() {
        card.classList.add('exit');
        setTimeout(() => {
          overlay.classList.remove('show');
          if (activeSlot) {
            activeSlot.classList.remove('flying');
          }
        }, 300);
      }

      closeBtn.addEventListener('click', closeLetter);
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeLetter();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && overlay.classList.contains('show'))
          closeLetter();
      });
    </script>
  </body>
</html>
